<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Chess Trainer</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #111;
}

#board {
  width: 480px;
  height: 480px;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  border: 5px solid #222;
  box-shadow: 0 0 20px rgba(0,0,0,0.6);
}

.square {
  width: 60px;
  height: 60px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.white { background: #f0d9b5; }
.black { background: #b58863; }

img.piece {
  width: 55px;
  height: 55px;
  cursor: grab;
  user-select: none;
}
</style>
</head>

<body>

<div id="board"></div>

<script>
const board = document.getElementById("board");

// posição inicial
const start = [
["br","bn","bb","bq","bk","bb","bn","br"],
["bp","bp","bp","bp","bp","bp","bp","bp"],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["wp","wp","wp","wp","wp","wp","wp","wp"],
["wr","wn","wb","wq","wk","wb","wn","wr"]
];

function createPiece(code) {
  const img = document.createElement("img");
  img.src = `pieces/${code}.png`;
  img.classList.add("piece");
  img.draggable = true;

  img.addEventListener("dragstart", e => {
    e.dataTransfer.setData("piece", code);
  });

  return img;
}

for (let r = 0; r < 8; r++) {
  for (let c = 0; c < 8; c++) {

    const square = document.createElement("div");
    square.classList.add("square");
    square.classList.add((r + c) % 2 === 0 ? "white" : "black");

    const piece = start[r][c];
    if (piece) {
      square.appendChild(createPiece(piece));
    }

    square.addEventListener("dragover", e => e.preventDefault());

    square.addEventListener("drop", e => {
      e.preventDefault();

      const code = e.dataTransfer.getData("piece");

      const existing = square.querySelector("img");
      if (existing) existing.remove();

      square.appendChild(createPiece(code));
    });

    board.appendChild(square);
  }
}
</script>

</body>
</html>
