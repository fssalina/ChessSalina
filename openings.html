<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Openings - ChessSalina</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

<style>

/* ===== LAYOUT ORIGINAL ===== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(180deg,#ffffff,#f8f8f8);
color:#222;
overflow-x:hidden;
}

.container{
width:92%;
max-width:1500px;
margin:auto;
}

/* NAVBAR */
.navbar{
margin-top:20px;
background:rgba(255,255,255,.85);
border:1px solid rgba(212,160,23,.15);
border-radius:28px;
padding:25px 45px;
display:flex;
justify-content:space-between;
align-items:center;
backdrop-filter:blur(20px);
box-shadow:0 5px 30px rgba(0,0,0,.04);
}

.logo{
display:flex;
align-items:center;
gap:14px;
}

.logo-icon{
font-size:38px;
color:#D4A017;
}

.logo-text{
font-size:38px;
font-weight:600;
}

.logo-text span{
color:#D4A017;
}

.menu{
display:flex;
gap:55px;
}

.menu a{
text-decoration:none;
color:#222;
font-weight:500;
}

.hero{
padding:70px 0 40px;
}

.hero h1{
font-size:72px;
font-weight:700;
}

.hero span{
color:#D4A017;
}

/* GRID */
.main-grid{
display:grid;
grid-template-columns:280px 1fr 340px;
gap:25px;
margin-bottom:40px;
}

.card{
background:rgba(255,255,255,.85);
border-radius:28px;
padding:25px;
border:1px solid rgba(212,160,23,.12);
backdrop-filter:blur(20px);
}

/* BOARD */
#board{
width:100%;
max-width:620px;
margin:auto;
height:500px;
}

/* ===== MELHORIAS ===== */

.highlight-square{
position:relative;
}

.highlight-square::after{
content:"";
position:absolute;
width:18%;
height:18%;
border-radius:50%;
background:rgba(212,160,23,.75);
top:50%;
left:50%;
transform:translate(-50%,-50%);
pointer-events:none;
animation:fadeIn .12s ease-out;
}

@keyframes fadeIn{
from{opacity:0;transform:translate(-50%,-50%) scale(0.6);}
to{opacity:1;transform:translate(-50%,-50%) scale(1);}
}

#board.check{
box-shadow:0 0 25px rgba(255,0,0,.35);
}

</style>
</head>

<body>

<div class="container">

<nav class="navbar">
<div class="logo">
<div class="logo-icon">♔</div>
<div class="logo-text">Chess<span>Salina</span></div>
</div>

<div class="menu">
<a href="index.html">Home</a>
<a href="openings.html">Openings</a>
<a href="tactics.html">Tactics</a>
<a href="analysis.html">Analysis</a>
</div>
</nav>

<section class="hero">
<h1>📖 <span>Openings</span></h1>
</section>

<div class="main-grid">

<div class="card"></div>

<div class="card">
<div id="board"></div>
</div>

<div class="card"></div>

</div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script>

var game = new Chess();

/* ===== SONS ===== */
var sounds = {
  move: new Audio("https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-self.mp3"),
  capture: new Audio("https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/capture.mp3"),
  illegal: new Audio("https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/error.mp3"),
  check: new Audio("https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-check.mp3")
};

function play(s){
  sounds[s].currentTime = 0;
  sounds[s].play();
}

/* ===== MOVES ===== */
function removeHighlights(){
  document.querySelectorAll('.square-55d63')
    .forEach(el => el.classList.remove('highlight-square'));
}

function showMoves(square){
  removeHighlights();

  var moves = game.moves({square:square, verbose:true});

  moves.forEach(m=>{
    var el = document.querySelector('[data-square="'+m.to+'"]');
    if(el) el.classList.add('highlight-square');
  });
}

/* ===== BOARD ===== */
var board = Chessboard('board', {

  position:'start',
  draggable:true,

  pieceTheme:'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',

  onDragStart:function(source,piece){

    if(game.game_over()) return false;

    if((game.turn()==='w' && piece[0]==='b') ||
       (game.turn()==='b' && piece[0]==='w')) return false;

    showMoves(source);
  },

  onDrop:function(source,target){

    var move = game.move({
      from:source,
      to:target,
      promotion:'q'
    });

    removeHighlights();

    if(move===null){
      play("illegal");
      return "snapback";
    }

    if(move.captured) play("capture");
    else play("move");

    if(game.in_check()){
      document.getElementById("board").classList.add("check");
      setTimeout(()=>play("check"),100);
    } else {
      document.getElementById("board").classList.remove("check");
    }

    setTimeout(()=>board.position(game.fen(),true),120);
  }

});

</script>

</body>
</html>
